# A4A Learn - Alembic Configuration
# Database URL is loaded from app.core.config / .env
# Do NOT place database passwords in this file.

[alembic]
script_location = %(here)s/alembic

# Database URL is intentionally left blank.
# It will be supplied dynamically by alembic/env.py.
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/a4alearn

# Migration file naming
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Maximum characters for autogenerated migration slug
truncate_slug_length = 40

# Timezone
timezone =

# Version path separator
version_path_separator = os

# Output encoding
output_encoding = utf-8


[post_write_hooks]

# No post-write hooks required for MVP.


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S